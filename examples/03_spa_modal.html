<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <title>仪表盘</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 560px; margin: 40px auto; }
    .modal { position: fixed; inset: 0; display: flex; align-items: center;
             justify-content: center; background: rgba(0,0,0,.4); }
    .modal .card { background: #fff; padding: 24px; border-radius: 8px; min-width: 280px; }
    .toast { position: fixed; bottom: 20px; right: 20px; background: #222; color: #fff;
             padding: 10px 16px; border-radius: 6px; }
  </style>
</head>
<body>
  <!-- 复杂度档位 ③：动态/交互。弹窗与提示在点击后才创建，初始 DOM 中不存在，
       单次快照看不到——必须真正驱动浏览器操作才能定位与断言。-->
  <h1>仪表盘</h1>
  <button id="openSettings">打开设置</button>

  <div id="modalRoot"></div>
  <div id="toastRoot"></div>

  <script>
    const modalRoot = document.getElementById('modalRoot');
    const toastRoot = document.getElementById('toastRoot');

    document.getElementById('openSettings').addEventListener('click', () => {
      modalRoot.innerHTML = `
        <div class="modal" role="dialog" aria-label="设置">
          <div class="card">
            <h2>设置</h2>
            <label><input type="checkbox" id="darkMode"> 深色模式</label>
            <div style="margin-top:16px">
              <button id="saveSettings">保存</button>
              <button id="closeSettings">取消</button>
            </div>
          </div>
        </div>`;
      document.getElementById('saveSettings').addEventListener('click', () => {
        modalRoot.innerHTML = '';
        toastRoot.innerHTML = '<div class="toast">设置已保存</div>';
      });
      document.getElementById('closeSettings').addEventListener('click', () => {
        modalRoot.innerHTML = '';
      });
    });
  </script>
</body>
</html>
