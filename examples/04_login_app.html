<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <title>管理后台</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 560px; margin: 40px auto; }
    .hidden { display: none; }
    label { display: block; margin-top: 12px; font-weight: 600; }
    input { padding: 6px; margin-top: 4px; }
    nav button { margin-right: 8px; }
    .err { color: #c00; }
  </style>
</head>
<body>
  <!-- 复杂度档位 ④：复杂应用。需先登录(凭据 admin/secret)，登录后才出现多视图后台；
       一句话描述通常要拆成多条聚焦用例(概览/订单/设置)——需要规划 + 套件。-->
  <section id="login">
    <h1>登录</h1>
    <label for="user">用户名</label>
    <input id="user" name="username">
    <label for="pass">密码</label>
    <input id="pass" name="password" type="password">
    <button id="loginBtn">登录</button>
    <p id="loginError" class="err hidden">用户名或密码错误</p>
  </section>

  <section id="app" class="hidden">
    <nav>
      <button class="tab" id="tabOverview">概览</button>
      <button class="tab" id="tabOrders">订单</button>
      <button class="tab" id="tabSettings">设置</button>
    </nav>
    <div id="viewOverview"><h2>概览</h2><p>欢迎回来，管理员</p></div>
    <div id="viewOrders" class="hidden"><h2>订单</h2><ul><li>订单 #1001</li><li>订单 #1002</li></ul></div>
    <div id="viewSettings" class="hidden"><h2>设置</h2><button id="logout">退出登录</button></div>
  </section>

  <script>
    const $ = id => document.getElementById(id);
    $('loginBtn').addEventListener('click', () => {
      if ($('user').value === 'admin' && $('pass').value === 'secret') {
        $('login').classList.add('hidden');
        $('app').classList.remove('hidden');
      } else {
        $('loginError').classList.remove('hidden');
      }
    });
    function show(view) {
      for (const v of ['Overview', 'Orders', 'Settings']) $('view' + v).classList.add('hidden');
      $('view' + view).classList.remove('hidden');
    }
    $('tabOverview').addEventListener('click', () => show('Overview'));
    $('tabOrders').addEventListener('click', () => show('Orders'));
    $('tabSettings').addEventListener('click', () => show('Settings'));
  </script>
</body>
</html>
