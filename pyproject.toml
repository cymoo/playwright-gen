[project]
name = "playwright-gen"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "lovia",
    "playwright",
    "pytest",
    "pytest-playwright",
    "python-dotenv",
    "pydantic",
]

[project.scripts]
playwright-gen = "playwright_gen.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["playwright_gen"]
