[project]
name = "playwright-gen"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "lovia",
    "playwright",
    "pytest",
    "pytest-playwright",
    "python-dotenv",
    "pydantic",
]

[project.optional-dependencies]
# v3 的可选 MCP 后端（额外引入 Node 端的 @playwright/mcp，需自行 `npx`）
mcp = ["lovia[mcp]"]

[project.scripts]
pwgen-v0 = "v0.cli:main"
pwgen-v1 = "v1.cli:main"
pwgen-v2 = "v2.cli:main"
pwgen-v3 = "v3.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["common", "v0", "v1", "v2", "v3"]

[tool.pytest.ini_options]
# 仅收集 tests/ 下的单测/集成测试；生成的用例在 output/ 下由各版本自行用 pytest 运行
testpaths = ["tests"]
